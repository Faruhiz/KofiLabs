name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pkg
        run: npm install -g pkg

      - name: Build EXE
        run: pkg server.js --target node18-win-x64 --output KofiLabs.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KofiLabs
          path: KofiLabs.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: KofiLabs.exe
